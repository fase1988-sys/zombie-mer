<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zombie-Mer 3D FPS Prototype</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050806;color:#fff;font-family:system-ui,Arial}
#game{position:fixed;inset:0}
#hud{position:fixed;inset:0;pointer-events:none}
#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%)}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 4px #000}
#cross:before{width:18px;height:2px;left:0;top:8px}#cross:after{width:2px;height:18px;left:8px;top:0}
#stats{position:absolute;left:20px;bottom:20px;font-weight:800;text-shadow:0 2px 5px #000}
#ammo{position:absolute;right:22px;bottom:20px;font-size:25px;font-weight:900;text-shadow:0 2px 5px #000}
#msg{position:absolute;left:50%;top:24px;transform:translateX(-50%);font-weight:800;text-align:center;text-shadow:0 2px 6px #000}
#start{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.78);z-index:3}
.card{text-align:center;max-width:520px;padding:28px}.card h1{font-size:34px;margin:0 0 10px}.card p{line-height:1.5;color:#ddd}
button{border:0;border-radius:12px;padding:14px 24px;font-weight:900;font-size:17px;cursor:pointer;background:#d7a329;color:#17120a}
#back{position:fixed;left:14px;top:14px;z-index:5;color:#fff;text-decoration:none;background:#111b;padding:9px 12px;border-radius:9px;font-weight:700}
</style>
</head><body>
<a id="back" href="./">← 2D OYUNA DÖN</a><div id="game"></div>
<div id="hud"><div id="cross"></div><div id="msg">3D FPS PROTOTİP</div><div id="stats">CAN 100<br>WASD · Mouse · Sol tık ateş</div><div id="ammo">12 / ∞</div></div>
<div id="start"><div class="card"><h1>ZOMBIE-MER 3D</h1><p>Gerçek first-person prototip. WASD ile yürü, mouse ile bak, sol tıkla ateş et. Zombiler sana doğru gelir.</p><button id="play">3D TESTİ BAŞLAT</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
class FPSControls{
 constructor(camera,dom){this.camera=camera;this.dom=dom;this.isLocked=false;this.yaw=0;this.pitch=0;this.handlers={lock:[],unlock:[]};
  document.addEventListener('pointerlockchange',()=>{this.isLocked=document.pointerLockElement===this.dom;for(const fn of this.handlers[this.isLocked?'lock':'unlock'])fn();});
  document.addEventListener('mousemove',e=>{if(!this.isLocked)return;this.yaw-=e.movementX*.0022;this.pitch=Math.max(-1.48,Math.min(1.48,this.pitch-e.movementY*.0022));this.camera.rotation.set(this.pitch,this.yaw,0,'YXZ');});
 }
 addEventListener(t,fn){if(this.handlers[t])this.handlers[t].push(fn)}
 lock(){this.dom.requestPointerLock&&this.dom.requestPointerLock()}
 unlock(){document.exitPointerLock&&document.exitPointerLock()}
 moveForward(d){this.camera.position.x-=Math.sin(this.yaw)*d;this.camera.position.z-=Math.cos(this.yaw)*d}
 moveRight(d){this.camera.position.x+=Math.cos(this.yaw)*d;this.camera.position.z-=Math.sin(this.yaw)*d}
}
const host=document.getElementById('game'),scene=new THREE.Scene();scene.background=new THREE.Color(0x101812);scene.fog=new THREE.Fog(0x101812,18,75);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,150);camera.position.set(0,1.7,8);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xb7c9b4,0x28301e,2.2));const moon=new THREE.DirectionalLight(0xdbe5ff,2.5);moon.position.set(8,18,6);moon.castShadow=true;scene.add(moon);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(120,120),new THREE.MeshStandardMaterial({color:0x31422b,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const roadMat=new THREE.MeshStandardMaterial({color:0x252827,roughness:1});
for(const [x,z,w,d] of [[0,0,9,120],[0,0,120,9]]){const r=new THREE.Mesh(new THREE.PlaneGeometry(w,d),roadMat);r.rotation.x=-Math.PI/2;r.position.set(x,.012,z);scene.add(r)}
function box(x,y,z,w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:.85}));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m}
for(let i=0;i<16;i++){const a=i/16*Math.PI*2,r=22+(i%3)*7;box(Math.cos(a)*r,2,Math.sin(a)*r,5,4,5,i%2?0x63584a:0x4d5d55)}
for(let i=0;i<38;i++){const a=Math.random()*Math.PI*2,r=12+Math.random()*45;const x=Math.cos(a)*r,z=Math.sin(a)*r;const trunk=box(x,1,z,.55,2,.55,0x513821);const crown=new THREE.Mesh(new THREE.ConeGeometry(2,5,7),new THREE.MeshStandardMaterial({color:0x243c22}));crown.position.set(x,4,z);scene.add(crown)}
const zombies=[];
function zombie(x,z){const g=new THREE.Group(),cloth=new THREE.MeshStandardMaterial({color:0x4d5146}),skin=new THREE.MeshStandardMaterial({color:0x7b8b62});
const body=new THREE.Mesh(new THREE.BoxGeometry(.75,1.05,.4),cloth);body.position.y=1.35;g.add(body);const head=new THREE.Mesh(new THREE.BoxGeometry(.48,.5,.48),skin);head.position.y=2.12;g.add(head);
for(const sx of [-.5,.5]){const arm=new THREE.Mesh(new THREE.BoxGeometry(.22,.9,.22),skin);arm.position.set(sx,1.45,-.15);arm.rotation.x=-.8;g.add(arm)}
g.position.set(x,0,z);g.userData={hp:3,speed:1.25+Math.random()*.65};scene.add(g);zombies.push(g)}
for(let i=0;i<10;i++){const a=Math.random()*Math.PI*2,r=16+Math.random()*25;zombie(Math.cos(a)*r,Math.sin(a)*r)}
const controls=new FPSControls(camera,renderer.domElement),keys={};let hp=100,ammo=12,last=performance.now(),dead=false;
document.getElementById('play').onclick=()=>{try{controls.lock()}catch(e){document.getElementById('msg').textContent='Mouse kilidi açılamadı · tekrar tıkla'}};controls.addEventListener('lock',()=>document.getElementById('start').style.display='none');controls.addEventListener('unlock',()=>{if(!dead)document.getElementById('start').style.display='grid'});
addEventListener('keydown',e=>keys[e.code]=true);addEventListener('keyup',e=>keys[e.code]=false);
const ray=new THREE.Raycaster();addEventListener('mousedown',e=>{if(e.button!==0||!controls.isLocked||dead)return;if(ammo<=0){ammo=12;return}ammo--;document.getElementById('ammo').textContent=ammo+' / ∞';ray.setFromCamera(new THREE.Vector2(0,0),camera);const hits=ray.intersectObjects(zombies,true);if(hits.length){let g=hits[0].object;while(g.parent&&!zombies.includes(g))g=g.parent;if(zombies.includes(g)){g.userData.hp--;g.position.addScaledVector(ray.ray.direction,.25);if(g.userData.hp<=0){scene.remove(g);zombies.splice(zombies.indexOf(g),1);setTimeout(()=>{const a=Math.random()*Math.PI*2;zombie(camera.position.x+Math.cos(a)*28,camera.position.z+Math.sin(a)*28)},1200)}}}});
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.04,(t-last)/1000);last=t;if(controls.isLocked&&!dead){const sp=6*dt;if(keys.KeyW)controls.moveForward(sp);if(keys.KeyS)controls.moveForward(-sp);if(keys.KeyA)controls.moveRight(-sp);if(keys.KeyD)controls.moveRight(sp);camera.position.y=1.7;camera.position.x=Math.max(-55,Math.min(55,camera.position.x));camera.position.z=Math.max(-55,Math.min(55,camera.position.z));
for(const z of zombies){const dx=camera.position.x-z.position.x,dz=camera.position.z-z.position.z,d=Math.hypot(dx,dz)||1;z.lookAt(camera.position.x,z.position.y,camera.position.z);z.position.x+=dx/d*z.userData.speed*dt;z.position.z+=dz/d*z.userData.speed*dt;if(d<1.15){hp-=22*dt;document.getElementById('stats').innerHTML='CAN '+Math.max(0,Math.ceil(hp))+'<br>WASD · Mouse · Sol tık ateş';if(hp<=0){dead=true;controls.unlock();document.getElementById('msg').textContent='ÖLDÜN · sayfayı yenile';document.getElementById('start').style.display='none'}}}}
renderer.render(scene,camera)}
requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

window.addEventListener('error',e=>{const m=document.getElementById('msg');if(m)m.textContent='3D HATA: '+(e.message||'Bilinmeyen hata')});
</script></body></html>
