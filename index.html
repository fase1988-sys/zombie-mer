<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zombie-Mer 2D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101712;font-family:Arial,sans-serif;color:#fff}
canvas{display:block;width:100vw;height:100vh;image-rendering:auto}
#hud{position:fixed;left:18px;top:16px;background:linear-gradient(180deg,#111912e8,#0a0f0be8);border:1px solid #ffffff2b;border-radius:14px;padding:11px 15px;line-height:1.55;font-weight:800;pointer-events:none;box-shadow:0 8px 30px #0008,inset 0 1px #ffffff12;backdrop-filter:blur(5px)}
#ammo{position:fixed;right:22px;bottom:20px;font-size:22px;font-weight:900;text-shadow:0 2px 8px #000;background:#0b100cd9;border:1px solid #ffffff26;border-radius:12px;padding:9px 13px;box-shadow:0 7px 25px #0008}
#start{position:fixed;inset:0;display:grid;place-items:center;background:#0009}
.card{background:#151b16;border:1px solid #ffffff30;border-radius:18px;padding:26px;text-align:center;max-width:420px}
button{border:0;border-radius:12px;padding:13px 24px;font-size:17px;font-weight:800;cursor:pointer}
small{opacity:.7}
</style></head>
<body>
<canvas id="game"></canvas>
<div id="hud">❤️ CAN <span id="hp">100</span><br>🧟 ZOMBİ <span id="kills">0</span><br>💰 PARA <span id="money">0</span></div>
<div id="ammo">12 / ∞</div>
<div id="start"><div class="card"><h1>Zombie-Mer 2D</h1><p>WASD ile hareket · Mouse ile nişan · Sol tık ateş · R şarjör</p><button id="play">OYUNA BAŞLA</button><p><small>Hayatta kal, zombileri temizle.</small></p></div></div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');let W,H,D=devicePixelRatio||1;
function resize(){W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const world={w:2400,h:1800};const p={x:1200,y:900,r:18,s:250,hp:100,ang:0};let keys={},mouse={x:W/2,y:H/2},bullets=[],zombies=[],trees=[],houses=[],particles=[],corpses=[],kills=0,money=0,ammo=12,reloading=false,running=false,last=performance.now(),shake=0,muzzle=0;
for(let i=0;i<85;i++)trees.push({x:60+Math.random()*(world.w-120),y:60+Math.random()*(world.h-120),r:18+Math.random()*14,v:Math.random()});
for(let i=0;i<18;i++){let xx=130+Math.random()*(world.w-360),yy=130+Math.random()*(world.h-300);houses.push({x:xx,y:yy,w:110+Math.random()*70,h:80+Math.random()*55})}
function spawn(){let a=Math.random()*Math.PI*2,d=500+Math.random()*350;zombies.push({x:Math.max(30,Math.min(world.w-30,p.x+Math.cos(a)*d)),y:Math.max(30,Math.min(world.h-30,p.y+Math.sin(a)*d)),r:17,hp:3,s:58+Math.random()*35})}
for(let i=0;i<16;i++)spawn();
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='KeyR'&&!reloading&&ammo<12){reloading=true;document.getElementById('ammo').textContent='YENİLENİYOR';setTimeout(()=>{ammo=12;reloading=false;document.getElementById('ammo').textContent='12 / ∞'},800)}});addEventListener('keyup',e=>keys[e.code]=0);
addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
addEventListener('mousedown',e=>{if(e.button||!running||reloading||ammo<=0)return;ammo--;document.getElementById('ammo').textContent=ammo+' / ∞';let cam=camPos();let wx=mouse.x+cam.x,wy=mouse.y+cam.y,a=Math.atan2(wy-p.y,wx-p.x);bullets.push({x:p.x+Math.cos(a)*30,y:p.y+Math.sin(a)*30,vx:Math.cos(a)*820,vy:Math.sin(a)*820,life:.9});muzzle=.07;shake=2.5;for(let i=0;i<5;i++)particles.push({x:p.x+Math.cos(a)*38,y:p.y+Math.sin(a)*38,vx:Math.cos(a)*(80+Math.random()*100)+(Math.random()-.5)*70,vy:Math.sin(a)*(80+Math.random()*100)+(Math.random()-.5)*70,life:.12+Math.random()*.12,size:2+Math.random()*3,c:'#ffd36a'})});
document.getElementById('play').onclick=()=>{running=true;document.getElementById('start').style.display='none'};
function camPos(){return{x:Math.max(0,Math.min(world.w-W,p.x-W/2)),y:Math.max(0,Math.min(world.h-H,p.y-H/2))}}
function circleRect(cx,cy,r,o){let qx=Math.max(o.x,Math.min(cx,o.x+o.w)),qy=Math.max(o.y,Math.min(cy,o.y+o.h));return (cx-qx)**2+(cy-qy)**2<r*r}
function update(dt){
 if(!running)return;let dx=(keys.KeyD?1:0)-(keys.KeyA?1:0),dy=(keys.KeyS?1:0)-(keys.KeyW?1:0),l=Math.hypot(dx,dy)||1,nx=p.x+dx/l*p.s*dt,ny=p.y+dy/l*p.s*dt;
 if(!houses.some(h=>circleRect(nx,p.y,p.r,h)))p.x=Math.max(p.r,Math.min(world.w-p.r,nx));if(!houses.some(h=>circleRect(p.x,ny,p.r,h)))p.y=Math.max(p.r,Math.min(world.h-p.r,ny));
 let cam=camPos();p.ang=Math.atan2(mouse.y+cam.y-p.y,mouse.x+cam.x-p.x);
 for(let b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt}
 bullets=bullets.filter(b=>b.life>0&&b.x>0&&b.y>0&&b.x<world.w&&b.y<world.h);
 for(let z of zombies){let a=Math.atan2(p.y-z.y,p.x-z.x);z.x+=Math.cos(a)*z.s*dt;z.y+=Math.sin(a)*z.s*dt;if(Math.hypot(z.x-p.x,z.y-p.y)<z.r+p.r){p.hp-=25*dt;document.getElementById('hp').textContent=Math.max(0,Math.ceil(p.hp));if(p.hp<=0){running=false;document.getElementById('start').style.display='grid';document.querySelector('.card h1').textContent='ÖLDÜN';document.querySelector('.card p').textContent='Skor: '+kills;document.getElementById('play').textContent='TEKRAR BAŞLA';document.getElementById('play').onclick=()=>location.reload()}}}
 for(let b of bullets)for(let z of zombies)if(z.hp>0&&Math.hypot(b.x-z.x,b.y-z.y)<z.r+4){z.hp--;b.life=0;if(z.hp<=0){kills++;money+=10;shake=4;corpses.push({x:z.x,y:z.y,a:Math.random()*6.28,life:7});for(let i=0;i<12;i++)particles.push({x:z.x,y:z.y,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,life:.25+Math.random()*.4,size:2+Math.random()*4,c:i%3?'#6e8d58':'#6e2525'});document.getElementById('kills').textContent=kills;document.getElementById('money').textContent=money}}
 for(let q of particles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.94;q.vy*=.94;q.life-=dt}particles=particles.filter(q=>q.life>0);for(let q of corpses)q.life-=dt;corpses=corpses.filter(q=>q.life>0);shake*=.84;muzzle=Math.max(0,muzzle-dt);zombies=zombies.filter(z=>z.hp>0);while(zombies.length<16)spawn();
}
function draw(){
 let cam=camPos(),sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;
 x.clearRect(0,0,W,H);
 // vignette/background
 let bg=x.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#243c28');bg.addColorStop(1,'#14271a');x.fillStyle=bg;x.fillRect(0,0,W,H);
 x.save();x.translate(-cam.x+sx,-cam.y+sy);
 // grass base + subtle checker texture
 x.fillStyle='#466d3c';x.fillRect(0,0,world.w,world.h);
 x.globalAlpha=.12;x.fillStyle='#b8d27b';for(let gx=20;gx<world.w;gx+=90)for(let gy=20;gy<world.h;gy+=90){x.beginPath();x.arc(gx+(gy%180)/6,gy,2.2,0,6.28);x.fill()}x.globalAlpha=1;
 // roads with borders and dashed center detail
 x.fillStyle='#927a5c';x.fillRect(0,world.h/2-72,world.w,144);x.fillRect(world.w/2-72,0,144,world.h);
 x.fillStyle='#aa9270';x.fillRect(0,world.h/2-58,world.w,116);x.fillRect(world.w/2-58,0,116,world.h);
 x.strokeStyle='#d5bd8b55';x.lineWidth=3;x.setLineDash([18,22]);x.beginPath();x.moveTo(0,world.h/2);x.lineTo(world.w,world.h/2);x.moveTo(world.w/2,0);x.lineTo(world.w/2,world.h);x.stroke();x.setLineDash([]);
 // tree shadows and layered crowns
 for(let t of trees){x.fillStyle='#00000028';x.beginPath();x.ellipse(t.x+9,t.y+13,t.r*1.05,t.r*.55,.25,0,6.28);x.fill();x.fillStyle='#60452b';x.fillRect(t.x-6,t.y-1,12,27);x.fillStyle=t.v>.5?'#214e28':'#2c5c31';x.beginPath();x.arc(t.x-7,t.y,t.r*.75,0,6.28);x.arc(t.x+8,t.y-5,t.r*.8,0,6.28);x.arc(t.x,t.y-12,t.r*.72,0,6.28);x.fill();x.fillStyle='#6f985044';x.beginPath();x.arc(t.x-8,t.y-12,t.r*.35,0,6.28);x.fill()}
 // houses: shadows, walls, roofs, windows
 for(let h of houses){x.fillStyle='#00000035';x.fillRect(h.x+9,h.y+12,h.w,h.h);let wall=x.createLinearGradient(h.x,h.y,h.x,h.y+h.h);wall.addColorStop(0,'#d2bc96');wall.addColorStop(1,'#9e8565');x.fillStyle=wall;x.fillRect(h.x,h.y,h.w,h.h);x.fillStyle='#733b31';x.beginPath();x.moveTo(h.x-14,h.y+9);x.lineTo(h.x+h.w/2,h.y-40);x.lineTo(h.x+h.w+14,h.y+9);x.closePath();x.fill();x.fillStyle='#3d291f';x.fillRect(h.x+h.w/2-13,h.y+h.h-34,26,34);x.fillStyle='#8ed0d8';x.fillRect(h.x+17,h.y+30,22,18);x.fillRect(h.x+h.w-39,h.y+30,22,18);x.strokeStyle='#e8d9b0';x.lineWidth=2;x.strokeRect(h.x+17,h.y+30,22,18);x.strokeRect(h.x+h.w-39,h.y+30,22,18)}
 // fading corpses
 for(let q of corpses){x.globalAlpha=Math.min(1,q.life);x.save();x.translate(q.x,q.y);x.rotate(q.a);x.fillStyle='#283529';x.beginPath();x.ellipse(0,0,22,12,0,0,6.28);x.fill();x.fillStyle='#6c2727';x.beginPath();x.ellipse(-5,4,12,5,.3,0,6.28);x.fill();x.restore()}x.globalAlpha=1;
 // bullets with glow/tracer
 x.lineCap='round';for(let b of bullets){let l=Math.hypot(b.vx,b.vy),ux=b.vx/l,uy=b.vy/l;x.strokeStyle='#ffd96899';x.lineWidth=3;x.beginPath();x.moveTo(b.x-ux*17,b.y-uy*17);x.lineTo(b.x,b.y);x.stroke();x.fillStyle='#fff1a3';x.beginPath();x.arc(b.x,b.y,3,0,6.28);x.fill()}
 // zombies with limbs, face, shadow, health
 for(let z of zombies){let a=Math.atan2(p.y-z.y,p.x-z.x);x.fillStyle='#00000033';x.beginPath();x.ellipse(z.x+4,z.y+15,18,8,0,0,6.28);x.fill();x.save();x.translate(z.x,z.y);x.rotate(a);x.strokeStyle='#40573a';x.lineWidth=7;x.beginPath();x.moveTo(-6,9);x.lineTo(-12,25);x.moveTo(6,9);x.lineTo(12,25);x.moveTo(-9,-2);x.lineTo(-20,5);x.moveTo(9,-2);x.lineTo(22,4);x.stroke();x.fillStyle='#334535';x.fillRect(-11,-5,22,25);x.fillStyle='#789567';x.beginPath();x.arc(0,-14,12,0,6.28);x.fill();x.fillStyle='#c9d06b';x.fillRect(3,-18,3,3);x.fillStyle='#40211e';x.fillRect(5,-9,5,2);x.restore();x.fillStyle='#251b1b';x.fillRect(z.x-15,z.y-z.r-15,30,4);x.fillStyle='#b7423d';x.fillRect(z.x-15,z.y-z.r-15,30*(z.hp/3),4)}
 // player body, arms and gun
 x.save();x.translate(p.x,p.y);x.rotate(p.ang);x.fillStyle='#00000035';x.beginPath();x.ellipse(5,15,21,9,0,0,6.28);x.fill();x.fillStyle='#334b3b';x.beginPath();x.arc(0,0,p.r+2,0,6.28);x.fill();x.strokeStyle='#c99773';x.lineWidth=7;x.beginPath();x.moveTo(8,-6);x.lineTo(27,-5);x.moveTo(8,6);x.lineTo(27,5);x.stroke();x.fillStyle='#25292c';x.fillRect(22,-6,31,12);x.fillStyle='#0d0f10';x.fillRect(46,-4,17,8);if(muzzle>0){x.fillStyle='#ffd45c';x.beginPath();x.moveTo(63,0);x.lineTo(78,-8);x.lineTo(73,0);x.lineTo(79,8);x.closePath();x.fill()}x.fillStyle='#d2a07c';x.beginPath();x.arc(-3,-4,10,0,6.28);x.fill();x.restore();
 // particles
 for(let q of particles){x.globalAlpha=Math.max(0,q.life*3);x.fillStyle=q.c;x.beginPath();x.arc(q.x,q.y,q.size,0,6.28);x.fill()}x.globalAlpha=1;
 x.restore();
 // atmospheric vignette
 let vg=x.createRadialGradient(W/2,H/2,Math.min(W,H)*.25,W/2,H/2,Math.max(W,H)*.72);vg.addColorStop(0,'#0000');vg.addColorStop(1,'#0009');x.fillStyle=vg;x.fillRect(0,0,W,H);
}
function loop(t){let dt=Math.min(.04,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
