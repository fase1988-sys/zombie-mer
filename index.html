<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zombie-Mer 3D</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050806;color:#fff;font-family:system-ui,Arial}
#game{position:fixed;inset:0}
#hud{position:fixed;inset:0;pointer-events:none}
#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%)}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 4px #000}
#cross:before{width:18px;height:2px;left:0;top:8px}#cross:after{width:2px;height:18px;left:8px;top:0}
#stats{position:absolute;left:20px;bottom:20px;font-weight:800;text-shadow:0 2px 5px #000}
#ammo{position:absolute;right:22px;bottom:20px;font-size:25px;font-weight:900;text-shadow:0 2px 5px #000}
#msg{position:absolute;left:50%;top:24px;transform:translateX(-50%);font-weight:800;text-align:center;text-shadow:0 2px 6px #000}
#start{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.78);z-index:3}
.card{text-align:center;max-width:520px;padding:28px}.card h1{font-size:34px;margin:0 0 10px}.card p{line-height:1.5;color:#ddd}
button{border:0;border-radius:12px;padding:14px 24px;font-weight:900;font-size:17px;cursor:pointer;background:#d7a329;color:#17120a}
#back{position:fixed;left:14px;top:14px;z-index:5;color:#fff;text-decoration:none;background:#111b;padding:9px 12px;border-radius:9px;font-weight:700}
</style>
</head><body>
<div id="game"></div>
<div id="hud"><div id="cross"></div><div id="msg">ZOMBIE-MER 3D</div><div id="stats">CAN 100<br>WASD · Mouse · Sol tık ateş</div><div id="ammo">12 / ∞</div></div>
<div id="start"><div class="card"><h1>ZOMBIE-MER 3D</h1><p>Yeni 3D survival temel sürümü. WASD hareket · Mouse bakış · Sol tık ateş · R şarjör.</p><button id="play">OYUNA BAŞLA</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
class FPSControls{
 constructor(camera,dom){this.camera=camera;this.dom=dom;this.isLocked=false;this.yaw=0;this.pitch=0;this.handlers={lock:[],unlock:[]};
  document.addEventListener('pointerlockchange',()=>{this.isLocked=document.pointerLockElement===this.dom;for(const fn of this.handlers[this.isLocked?'lock':'unlock'])fn();});
  document.addEventListener('mousemove',e=>{if(!this.isLocked)return;this.yaw-=e.movementX*.0022;this.pitch=Math.max(-1.48,Math.min(1.48,this.pitch-e.movementY*.0022));gunSwayX=Math.max(-10,Math.min(10,gunSwayX+e.movementX*.018));gunSwayY=Math.max(-7,Math.min(7,gunSwayY+e.movementY*.014));this.camera.rotation.set(this.pitch,this.yaw,0,'YXZ');});
 }
 addEventListener(t,fn){if(this.handlers[t])this.handlers[t].push(fn)}
 lock(){this.dom.requestPointerLock&&this.dom.requestPointerLock()}
 unlock(){document.exitPointerLock&&document.exitPointerLock()}
 moveForward(d){this.camera.position.x-=Math.sin(this.yaw)*d;this.camera.position.z-=Math.cos(this.yaw)*d}
 moveRight(d){this.camera.position.x+=Math.cos(this.yaw)*d;this.camera.position.z-=Math.sin(this.yaw)*d}
}
const host=document.getElementById('game'),scene=new THREE.Scene();scene.background=new THREE.Color(0x101812);scene.fog=new THREE.Fog(0x101812,35,130);
const camera=new THREE.PerspectiveCamera(78,innerWidth/innerHeight,.1,240);camera.position.set(0,1.7,8);
// FPS viewmodel: centered two-handed pistol stance.
const viewModel=new THREE.Group();camera.add(viewModel);scene.add(camera);
viewModel.position.set(.12,-.27,-.66);viewModel.rotation.set(-.035,0,0);
const vmMat=(c,metal=.2,rough=.55)=>new THREE.MeshStandardMaterial({color:c,metalness:metal,roughness:rough,depthTest:false,depthWrite:false});
function part(parent,geo,mat,x,y,z,rx=0,ry=0,rz=0){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.rotation.set(rx,ry,rz);m.renderOrder=30;parent.add(m);return m}
const gunMat=vmMat(0x24282b,.65,.32),gunDark=vmMat(0x0b0d0e,.45,.42),glove=vmMat(0x202324,.05,.88);
const pistol=new THREE.Group();viewModel.add(pistol);
part(pistol,new THREE.BoxGeometry(.16,.095,.52),gunMat,0,.08,-.18);
part(pistol,new THREE.BoxGeometry(.135,.06,.55),gunDark,0,.145,-.18);
part(pistol,new THREE.BoxGeometry(.115,.25,.13),gunDark,0,-.095,.025,-.17);
part(pistol,new THREE.BoxGeometry(.12,.035,.14),gunDark,0,-.235,.055,-.17);
part(pistol,new THREE.BoxGeometry(.018,.04,.025),gunDark,0,.205,-.41);
part(pistol,new THREE.BoxGeometry(.045,.025,.025),gunDark,0,.195,.055);
const guard=part(pistol,new THREE.TorusGeometry(.052,.009,8,18,Math.PI*1.5),gunDark,0,-.025,-.025,Math.PI/2,0,.18);
function finger(parent,x,y,z,len,rx,ry,rz){return part(parent,new THREE.CapsuleGeometry(.015,len,5,8),glove,x,y,z,rx,ry,rz)}
function makeRightHand(){const g=new THREE.Group();const palm=part(g,new THREE.SphereGeometry(.075,12,10),glove,.045,-.08,.055);palm.scale.set(.9,1.15,.72);part(g,new THREE.CylinderGeometry(.06,.075,.23,12),glove,.06,-.12,.18,Math.PI/2);finger(g,.082,-.02,-.015,.095,1.32,0,.12);finger(g,.078,-.055,.005,.095,1.22,0,.10);finger(g,.073,-.09,.025,.09,1.12,0,.08);finger(g,.066,-.12,.045,.08,1.04,0,.06);finger(g,-.015,-.025,-.015,.10,1.28,0,-.55);return g}
function makeLeftHand(){const g=new THREE.Group();const palm=part(g,new THREE.SphereGeometry(.073,12,10),glove,-.045,-.09,.035);palm.scale.set(.95,1.12,.7);part(g,new THREE.CylinderGeometry(.06,.075,.24,12),glove,-.08,-.13,.17,Math.PI/2);finger(g,-.09,-.025,-.02,.10,1.28,0,-.16);finger(g,-.088,-.06,0,.10,1.18,0,-.13);finger(g,-.082,-.095,.02,.09,1.10,0,-.10);finger(g,-.073,-.125,.04,.08,1.02,0,-.08);finger(g,.018,-.02,-.025,.105,1.26,0,.55);return g}
const rightHand=makeRightHand();rightHand.position.set(0,0,0);rightHand.rotation.set(0,0,0);viewModel.add(rightHand);
const leftHand=makeLeftHand();leftHand.position.set(-.015,-.005,-.01);leftHand.rotation.set(0,0,0);viewModel.add(leftHand);
const muzzleFlash=new THREE.PointLight(0xffb34d,0,2);muzzleFlash.position.set(0,.12,-.48);pistol.add(muzzleFlash);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xb7c9b4,0x28301e,1.55));const moon=new THREE.DirectionalLight(0xdbe5ff,2.5);moon.position.set(8,18,6);moon.castShadow=true;scene.add(moon);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(240,240),new THREE.MeshStandardMaterial({color:0x31422b,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const roadMat=new THREE.MeshStandardMaterial({color:0x252827,roughness:1});
for(const [x,z,w,d] of [[0,0,9,120],[0,0,120,9]]){const r=new THREE.Mesh(new THREE.PlaneGeometry(w,d),roadMat);r.rotation.x=-Math.PI/2;r.position.set(x,.012,z);scene.add(r)}
function box(x,y,z,w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:.85}));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m}
for(let i=0;i<22;i++){const a=i/22*Math.PI*2,r=28+(i%4)*12;const x=Math.cos(a)*r,z=Math.sin(a)*r;box(x,1.6,z,6,3.2,.3,0x5b574e);box(x-2.85,1.6,z+2.8,.3,3.2,5.6,0x5b574e);box(x+2.85,1.6,z+2.8,.3,3.2,5.6,0x5b574e);box(x,1.6,z+5.6,6,3.2,.3,0x5b574e);const roof=new THREE.Mesh(new THREE.ConeGeometry(4.3,1.7,4),new THREE.MeshStandardMaterial({color:0x342b27,roughness:1}));roof.position.set(x,4,z+2.8);roof.rotation.y=Math.PI/4;scene.add(roof)}
for(let i=0;i<80;i++){const a=Math.random()*Math.PI*2,r=15+Math.random()*90;const x=Math.cos(a)*r,z=Math.sin(a)*r;const trunk=box(x,1,z,.55,2,.55,0x513821);const crown=new THREE.Mesh(new THREE.ConeGeometry(2,5,7),new THREE.MeshStandardMaterial({color:0x243c22}));crown.position.set(x,4,z);scene.add(crown)}
const zombies=[];
function zombie(x,z){const g=new THREE.Group(),cloth=new THREE.MeshStandardMaterial({color:0x4d5146}),skin=new THREE.MeshStandardMaterial({color:0x7b8b62});
const body=new THREE.Mesh(new THREE.BoxGeometry(.75,1.05,.4),cloth);body.position.y=1.35;g.add(body);const head=new THREE.Mesh(new THREE.BoxGeometry(.48,.5,.48),skin);head.position.y=2.12;g.add(head);
for(const sx of [-.5,.5]){const arm=new THREE.Mesh(new THREE.BoxGeometry(.22,.9,.22),skin);arm.position.set(sx,1.45,-.15);arm.rotation.x=-.8;g.add(arm)}
g.position.set(x,0,z);g.userData={hp:3,speed:1.25+Math.random()*.65};scene.add(g);zombies.push(g)}
for(let i=0;i<10;i++){const a=Math.random()*Math.PI*2,r=16+Math.random()*25;zombie(Math.cos(a)*r,Math.sin(a)*r)}
const controls=new FPSControls(camera,renderer.domElement),keys={};let hp=100,ammo=12,last=performance.now(),dead=false,bob=0,reloading=false,gunKick=0,gunSwayX=0,gunSwayY=0,reloadT=0;
document.getElementById('play').onclick=()=>{try{controls.lock()}catch(e){document.getElementById('msg').textContent='Mouse kilidi açılamadı · tekrar tıkla'}};controls.addEventListener('lock',()=>document.getElementById('start').style.display='none');controls.addEventListener('unlock',()=>{if(!dead)document.getElementById('start').style.display='grid'});
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR'&&!reloading&&ammo<12){reloading=true;reloadT=0;document.getElementById('ammo').textContent='YENİLENİYOR';setTimeout(()=>{ammo=12;reloading=false;reloadT=0;document.getElementById('ammo').textContent='12 / ∞'},950)}});addEventListener('keyup',e=>keys[e.code]=false);
const ray=new THREE.Raycaster();addEventListener('mousedown',e=>{if(e.button!==0||!controls.isLocked||dead||reloading)return;if(ammo<=0)return;ammo--;gunKick=.075;muzzleFlash.intensity=3;setTimeout(()=>muzzleFlash.intensity=0,45);document.getElementById('ammo').textContent=ammo+' / ∞';ray.setFromCamera(new THREE.Vector2(0,0),camera);const hits=ray.intersectObjects(zombies,true);if(hits.length){let g=hits[0].object;while(g.parent&&!zombies.includes(g))g=g.parent;if(zombies.includes(g)){g.userData.hp--;g.position.addScaledVector(ray.ray.direction,.25);if(g.userData.hp<=0){scene.remove(g);zombies.splice(zombies.indexOf(g),1);setTimeout(()=>{const a=Math.random()*Math.PI*2;zombie(camera.position.x+Math.cos(a)*28,camera.position.z+Math.sin(a)*28)},1200)}}}});
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.04,(t-last)/1000);last=t;if(controls.isLocked&&!dead){const sp=6*dt;if(keys.KeyW)controls.moveForward(sp);if(keys.KeyS)controls.moveForward(-sp);if(keys.KeyA)controls.moveRight(-sp);if(keys.KeyD)controls.moveRight(sp);bob+=dt*10;const moving=keys.KeyW||keys.KeyS||keys.KeyA||keys.KeyD;camera.position.y=1.7+(moving?Math.sin(bob)*.018:0);gunKick*=.70;gunSwayX*=.84;gunSwayY*=.84;
const breathe=Math.sin(t*.0022)*.004;
const walkX=moving?Math.sin(bob*.5)*.012:0,walkY=moving?Math.abs(Math.cos(bob))*.014:0;
if(reloading)reloadT=Math.min(1,reloadT+dt*1.45);
const reloadWave=reloading?Math.sin(reloadT*Math.PI):0;
viewModel.position.x=.12+walkX-gunSwayX*.0007-.05*reloadWave;
viewModel.position.y=-.27-walkY-gunKick+breathe+gunSwayY*.0006-.07*reloadWave;
viewModel.position.z=-.66+.025*reloadWave;
viewModel.rotation.x=-.035+gunSwayY*.00035+.32*reloadWave;
viewModel.rotation.y=-gunSwayX*.00045-.12*reloadWave;
viewModel.rotation.z=-gunSwayX*.0003-.20*reloadWave;
camera.position.x=Math.max(-110,Math.min(110,camera.position.x));camera.position.z=Math.max(-110,Math.min(110,camera.position.z));
for(const z of zombies){const dx=camera.position.x-z.position.x,dz=camera.position.z-z.position.z,d=Math.hypot(dx,dz)||1;z.lookAt(camera.position.x,z.position.y,camera.position.z);z.position.x+=dx/d*z.userData.speed*dt;z.position.z+=dz/d*z.userData.speed*dt;if(d<1.15){hp-=22*dt;document.getElementById('stats').innerHTML='CAN '+Math.max(0,Math.ceil(hp))+'<br>WASD · Mouse · Sol tık ateş';if(hp<=0){dead=true;controls.unlock();document.getElementById('msg').textContent='ÖLDÜN · sayfayı yenile';document.getElementById('start').style.display='none'}}}}
renderer.render(scene,camera)}
requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

window.addEventListener('error',e=>{const m=document.getElementById('msg');if(m)m.textContent='3D HATA: '+(e.message||'Bilinmeyen hata')});
</script></body></html>
