name: Browser regression (visual-refactor)
on:
  push:
    branches: [visual-refactor]
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 &
      - run: node tests/browser-regression.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-refactor-browser-evidence
          path: test-results/
